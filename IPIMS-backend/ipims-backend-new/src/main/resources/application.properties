# =================================================================
# 1. SPRING DATA SOURCE (MySQL)
# =================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/ipims_pharmacy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=1100
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =================================================================
# 2. SPRING DATA JPA/HIBERNATE CONFIGURATION
# =================================================================

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ddl-auto settings:
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.timeout=30
spring.jpa.open-in-view=false


# =================================================================
# JWT Configuration (Use a long, complex secret for production)
# =================================================================
ipims.app.jwtSecret=Px6cSiv2jl9qcGy059Vniav7wEjRWeJr7wEjRWeJgPQ=
ipims.app.jwtExpirationMs=604800000
# 7 days in milliseconds


# =================================================================
# 3. HIKARI CONNECTION POOL (IMPORTANT)
# =================================================================

spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.housekeeping-period-ms=60000
