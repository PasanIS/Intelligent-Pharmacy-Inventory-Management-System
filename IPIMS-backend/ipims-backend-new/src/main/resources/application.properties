# =================================================================
# 1. SPRING DATA SOURCE (MySQL)
# =================================================================

# Database connection URL (change 'ipims_db' to your actual database name)
spring.datasource.url=jdbc:mysql://localhost:3306/ipims_pharmacy_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1100
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =================================================================
# 2. SPRING DATA JPA/HIBERNATE CONFIGURATION
# =================================================================

# Set the SQL dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ddl-auto settings:
# 'update': Hibernate updates the schema based on your entities
# 'create': Creates the schema every time the app starts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

